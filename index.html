const cc={};
const ORB={},rc=r=>AZ[r()*26|0]+AZ[r()*26|0]+String(r()*10000|0).padStart(4,"0");

function sysList(px,py,rad){const o=[];for(let i=Math.floor((px-rad-4500)/C);i<=Math.floor((px+rad+4500)/C);i++)for(let j=Math.floor((py-rad-4500)/C);j<=Math.floor((py+rad+4500)/C);j++){const s=cell(i,j);if(s&&Math.hypot(s.x-px,s.y-py)<rad+s.R)o.push(s)}return o}
function visible(){return sysList(S.x,S.y,RANGE).flatMap(s=>s.pl)}
const S={x:0,y:300,vx:0,vy:0,a:-Math.PI/2,fuel:100,cash:150,inv:Array(9).fill(0),mode:"fly",land:null,price:EL.map(e=>e[1]),log:[],trail:[],tt:0,flame:0,sold:0,col:{},bots:[],depl:{},seen:{},nb:0,flash:0,rs:0,q:0,ports:[{x:0,y:0}],names:{},ind:{},pf:0,msl:[],fx:[],tgt:null,fcd:0,ft:0};

const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),PEN='<button class="pen" data-a="rename" title="rename">✎</button>';const busy=()=>$("#info").matches(":hover")||document.activeElement.tagName=="INPUT";let tl="";const setT=h=>{if(h!==tl){tl=h;$("#title").innerHTML=h}};const sv=p=>S.depl[p.code]=p.dep.map(d=>d.stock),sm=a=>a.reduce((u,v)=>u+v,0),botCost=()=>500+250*S.bots.length;
